[project]
name = "kiro-challenge-2022"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gurobipy>=13.0.2",
    "ipykernel>=7.3.0",
    "ipython>=9.16.1",
    "matplotlib>=3.11.1",
    "mypy>=2.3.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pulp>=3.3.2",
    "ruff>=0.16.2",
]

[tool.mypy]
# Several third-party dependencies do not ship type stubs or a py.typed marker.
# Keep checking this project while treating those external imports as untyped.
ignore_missing_imports = true
